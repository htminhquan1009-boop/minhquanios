<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINH QUÂN IOS - FREE FIRE MAX PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: #06010f;
            color: #fff; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .panel {
            background: linear-gradient(180deg, #3d1266 0%, #17042b 100%);
            width: 100%; max-width: 390px; border-radius: 32px; padding: 30px 24px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.1);
            position: relative; overflow: hidden;
        }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }

        /* === NÚT QUAY LẠI CHUNG === */
        .back-btn { 
            display: inline-flex; align-items: center; gap: 6px; 
            color: #c599ff; font-size: 15px; cursor: pointer; 
            margin-bottom: 18px; transition:.2s;
            background: rgba(255,255,255,0.05); padding: 8px 12px; 
            border-radius: 10px; border: 1px solid rgba(168,85,247,0.2);
        }
        .back-btn:hover { color: #fff; border-color: #a855f7; background: rgba(168,85,247,0.1); }

        /* === HEADER === */
        .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .brand h1 { font-size: 32px; font-weight: 800; line-height: 1.2; color: #fff; }
        .brand p { font-size: 13px; color: #c599ff; margin-top: 6px; }
        .status { background: rgba(0,0,0,0.4); padding: 10px 14px; border-radius: 16px; text-align: right; min-width: 150px; }
        .status .online { color: #00ffcc; font-weight: bold; font-size: 14px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 4px; }
        .status .online::before { content: ''; width: 8px; height: 8px; background: #00ffcc; border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.4} }
        .status .stats { font-size: 12px; color: #aaa; }

        /* === MÀN 1: NHẬP KEY === */
        .label { font-size: 14px; color: #c599ff; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .input-key {
            width: 100%; background: rgba(0,0,0,0.35); border: 2px solid rgba(168,85,247,0.2);
            padding: 18px 16px; border-radius: 16px; color: #fff; font-size: 16px;
            margin-bottom: 25px; outline: none; transition: .2s;
        }
        .input-key:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168,85,247,0.25); }
        .btn-primary {
            width: 100%; background: rgba(168,85,247,0.15); border: 2px solid #a855f7;
            color: #fff; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-bottom: 25px; transition: all 0.2s;
        }
        .btn-primary:hover { background: rgba(168,85,247,0.25); box-shadow: 0 0 20px rgba(168,85,247,0.3); }
        .btn-row { display: flex; gap: 12px; margin-bottom: 30px; }
        .btn-secondary {
            flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #ddd; padding: 14px; border-radius: 14px; font-size: 15px; cursor: pointer;
            transition: .2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-secondary:hover { border-color: #a855f7; color: #d8b4fe; }
        .footer { text-align: center; font-size: 13px; color: rgba(255,255,255,0.3); }

        /* === MÀN 2: CHỌN AIM === */
        .section-title { font-size: 15px; color: #c599ff; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .aim-option {
            width: 100%; background: rgba(0,0,0,0.3); border: 2px solid transparent;
            padding: 16px 18px; border-radius: 14px; color: #fff; font-size: 15px;
            margin-bottom: 10px; cursor: pointer; transition: all 0.25s ease;
            display: flex; justify-content: space-between; align-items: center;
        }
        .aim-option .left { display: flex; align-items: center; gap: 12px; }
        .aim-option .icon { color: #a855f7; font-size: 18px; }
        .aim-option .text strong { display: block; font-size: 15px; font-weight: 600; }
        .aim-option .text small { display: block; font-size: 12px; color: #999; margin-top: 2px; }
        .aim-option .arrow { color: #666; font-size: 18px; transition: .2s; }
        .aim-option.selected {
            border-color: #a855f7; background: rgba(168,85,247,0.15);
            box-shadow: 0 0 12px rgba(168,85,247,0.2);
        }
        .aim-option.selected .arrow { color: #a855f7; }
        .btn-activate {
            width: 100%; background: linear-gradient(90deg, #7c3aed 0%, #5b21b6 100%);
            border: none; color: #fff; padding: 18px; border-radius: 16px; font-size: 17px;
            font-weight: bold; cursor: pointer; margin: 20px 0;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-activate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        /* === MÀN 3: PROXY PANEL === */
        .time-box {
            background: rgba(0,0,0,0.3); padding: 10px; border-radius: 12px;
            text-align: center; color: #c599ff; font-size: 15px; margin-bottom: 20px;
        }
        .key-box {
            background: rgba(0,0,0,0.35); padding: 18px; border-radius: 16px;
            color: #c599ff; font-weight: bold; font-size: 18px; margin-bottom: 20px; text-align: center;
        }
        .row-info { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 20px; }
        .info-ip {
            flex: 1; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px;
            font-size: 14px; color: #fff;
        }
        .info-timer {
            flex: 1; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 12px;
            font-size: 14px; color: #ff5555; text-align: center;
        }
        .server-box {
            background: rgba(0,0,0,0.3); padding: 18px; border-radius: 16px; margin-bottom: 25px;
        }
        .server-box h4 { font-size: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .server-box div { display: flex; justify-content: space-between; padding: 6px 0; font-size: 15px; }
        .btn-proxy {
            width: 100%; background: rgba(168,85,247,0.15); border: 2px solid #a855f7;
            color: #fff; padding: 18px; border-radius: 16px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-bottom: 25px; transition: all 0.2s;
        }
        .btn-proxy:hover { background: rgba(168,85,247,0.25); box-shadow: 0 0 20px rgba(168,85,247,0.3); }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,0,0,0.95); color: #fff; padding: 14px 20px; border-radius: 12px; border: 1px solid #a855f7; box-shadow: 0 0 20px rgba(168,85,247,0.3); z-index: 9999; transition: transform 0.3s ease; font-size: 14px; max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>

    <div class="panel">

        <!-- === MÀN 1: NHẬP KEY === -->
        <div id="screenKey" class="screen active">
            <div class="header">
                <div class="brand">
                    <h1>FREE FIRE<br>MAX</h1>
                    <p>BY MINH QUÂN IOS</p>
