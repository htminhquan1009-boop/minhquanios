<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINH QUÂN IOS - FREE FIRE MAX PANEL</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body {
            background: linear-gradient(180deg, #2d0f55 0%, #1a0833 100%);
            color: #fff; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
            padding: 20px;
        }
        .panel {
            background: linear-gradient(180deg, #5b21b6 0%, #3b0764 100%);
            width: 100%; max-width: 390px; border-radius: 32px; padding: 30px 24px;
            border: 2px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.15);
        }
        .section-title {
            font-size: 13px; color: #c4b5fd; text-transform: uppercase;
            letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
        }
        .section-title svg { width: 18px; height: 18px; fill: #a855f7; }
        .input-key {
            width: 100%; background: rgba(0,0,0,0.4); border: 2px solid rgba(168,85,247,0.5);
            padding: 18px 16px; border-radius: 16px; color: #fff; font-size: 15px;
            margin-bottom: 30px; outline: none; transition: .2s;
        }
        .input-key:focus { border-color: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.3); }
        .aim-option {
            width: 100%; background: rgba(0,0,0,0.35); border: 2px solid transparent;
            padding: 16px 18px; border-radius: 14px; color: #fff; font-size: 15px;
            margin-bottom: 10px; cursor: pointer; transition: all 0.25s ease;
            display: flex; justify-content: space-between; align-items: center;
        }
        .aim-option .left { display: flex; align-items: center; gap: 12px; }
        .aim-option .icon { color: #a855f7; font-size: 18px; }
        .aim-option .text strong { display: block; font-size: 15px; font-weight: 600; }
        .aim-option .text small { display: block; font-size: 12px; color: #a8a8a8; margin-top: 2px; }
        .aim-option .arrow { color: #6b7280; font-size: 16px; transition: .2s; }
        .aim-option.selected {
            border-color: #a855f7; background: rgba(168,85,247,0.15);
            box-shadow: 0 0 10px rgba(168,85,247,0.2);
        }
        .aim-option.selected .arrow { color: #a855f7; }
        .btn-activate {
            width: 100%; background: linear-gradient(90deg, #7c3aed 0%, #5b21b6 100%);
            border: none; color: #fff; padding: 18px; border-radius: 16px; font-size: 17px;
            font-weight: bold; cursor: pointer; margin: 25px 0 30px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-activate:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }
        .btn-activate:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-row { display: flex; gap: 12px; }
        .btn-bottom {
            flex: 1; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.1);
            color: #e5e7eb; padding: 14px; border-radius: 14px; font-size: 14px;
            cursor: pointer; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn-bottom:hover { border-color: #a855f7; color: #d8b4fe; }
        .hidden { display: none !important; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: rgba(0,0,0,0.95); color: #fff; padding: 14px 20px; border-radius: 12px; border: 1px solid #a855f7; box-shadow: 0 0 20px rgba(168,85,247,0.3); z-index: 9999; transition: transform 0.3s ease; font-size: 14px; max-width: 90%; text-align: center; }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="panel">
        <!-- === LICENSE KEY === -->
        <p class="section-title">

            LICENSE KEY

        <input type="text" class="input-key" id="keyInput" placeholder="Nhập license key...">

        <!-- === CHỌN AIM === -->

            CHỌN AIM
        </p>

        <div id="aimList">
            <div class="aim-option" data-aim="Aim Body 100%" data-desc="bắn đầu cx đỏ" onclick="selectAim(this)">
                <div class="left">
                    <span class="icon">⚙️</span>
                    <div class="text"><strong>Aim Body 100%</strong><small>bắn đầu cx đỏ</small></div>
                </div>
                <span class="arrow">›</span>
            </div>
            <div class="aim-option" data-aim="Aim MagicBullet" data-desc="đạn ma thuật" onclick="selectAim(this)">
                <div class="left">
                    <span class="icon">⚙️</span>
                    <div class="text"><strong>Aim MagicBullet</strong><small>đạn ma thuật</small></div>
                </div>
                <span class="arrow">›</span>
            </div>
            <div class="aim-option" data-aim="Định vị súng màu xanh lá" data-desc="Định vị súng màu xanh lá" onclick="selectAim(this)">
                <div class="left">
                    <span class="icon">⚙️</span>
                    <div class="text"><strong>Định vị súng màu xanh lá</strong><small>Định vị súng màu xanh lá</small></div>
                </div>
                <span class="arrow">›</span>
            </div>
            <div class="aim-option" data-aim="Aim drag 7.0" data-desc="Aim drag 7.0" onclick="selectAim(this)">
                <div class="left">
                    <span class="icon">⚙️</span>
                    <div class="text"><strong>Aim drag 7.0</strong><small>Aim drag 7.0</small></div>
                </div>
                <span class="arrow">›</span>
            </div>
            <div class="aim-option" data-aim="Mod Free Fire ALOCK v2" data-desc="Auto Lock đầu" onclick="selectAim(this)">
                <div class="left">
                    <span class="icon">⚙️</span>
                    <div class="text"><strong>Mod Free Fire ALOCK v2</strong><small>Auto Lock đầu</small></div>
                </div>
                <span class="arrow">›</span>
            </div>
        </div>

        <!-- === KÍCH HOẠT === -->
        <button class="btn-activate" id="activateBtn" onclick="activateAim()" disabled>KÍCH HOẠT AIM →</button>

        <!-- === NÚT BOTTOM === -->
        <div class="btn-row">
            <button class="btn-bottom" onclick="showToast('🔓 Đang mở trang lấy key...')">🔒 GET KEY</button>
            <button class="btn-bottom" onclick="downloadAll()">🛡️ CERT</button>
        </div>
    </div>

<script>
let selectedAim = null;
const validKeys = ["Vanduyios-6FF4-6289-CYXG", "FREE-5H", "MINHQUANIOS2026", "VIP-TEST-123"];

function showToast(msg, dur=3500) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), dur);
}

// === CHỌN AIM ===
function selectAim(el) {
    // Bỏ chọn tất cả
    document.querySelectorAll('.aim-option').forEach(opt => opt.classList.remove('selected'));
    // Chọn cái được nhấn
    el.classList.add('selected');
    selectedAim = {
        name: el.dataset.aim,
        desc: el.dataset.desc
    };
    // Bật nút Kích Hoạt
    document.getElementById('activateBtn').disabled = false;
    showToast(`✅ Đã chọn: ${selectedAim.name}`);
}

// === KÍCH HOẠT AIM ===
function activateAim() {
    const key = document.getElementById('keyInput').value.trim();
    if (!key) return showToast("⚠️ Vui lòng nhập License Key!");
    if (!validKeys.includes(key)) return showToast("❌ License Key không hợp lệ!");
    if (!selectedAim) return showToast("⚠️ Vui lòng chọn 1 loại Aim!");

    showToast(`✅ Đã kích hoạt: ${selectedAim.name}\n🔑 Key: ${key}`, 4000);
    // Lưu lựa chọn
    localStorage.setItem('selectedAim', JSON.stringify(selectedAim));
    localStorage.setItem('licenseKey', key);
    
    // Hiệu ứng nút
    const btn = document.getElementById('activateBtn');
    btn.innerText = "✅ ĐÃ KÍCH HOẠT THÀNH CÔNG";
    btn.style.background = "linear-gradient(90deg, #059669 0%, #10b981 100%)";
    setTimeout(() => {
        btn.innerText = "KÍCH HOẠT AIM →";
        btn.style.background = "";
    }, 3000);
}

</script>
</body>
</html>
