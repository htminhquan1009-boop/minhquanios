<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINH QUÂN IOS - FREE FIRE MAX PANEL</title>
    <style>
        :root {
            --bg-color: #06010f;
            --panel-bg: linear-gradient(180deg, #3d1266 0%, #17042b 100%);
            --box-bg: rgba(255, 255, 255, 0.06);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-purple: #c599ff;
            --btn-main-border: #6a25b3;
            --neon-glow: 0 0 15px rgba(168, 85, 247, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .panel-container {
            background: var(--panel-bg);
            width: 100%;
            max-width: 390px;
            border-radius: 40px;
            padding: 30px 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .brand-header {
            text-align: left;
            margin-bottom: 25px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .brand-title h1 {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(to right, #ffffff, #c599ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(197, 153, 255, 0.3);
        }

        .brand-title p {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2px;
        }

        .status-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 12px;
            font-size: 11px;
            text-align: right;
            backdrop-filter: blur(10px);
        }

        .status-online {
            color: #00ffcc;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }

        .status-online::before {
            content: ""; width: 6px; height: 6px; background: #00ffcc; border-radius: 50%; display: inline-block; box-shadow: 0 0 8px #00ffcc;
        }

        .status-details {
            color: rgba(255, 255, 255, 0.6); margin-top: 4px; font-family: monospace;
        }

        .license-header {
            text-align: left; font-size: 11px; font-weight: bold; color: rgba(255, 255, 255, 0.5); letter-spacing: 1px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
        }

        .input-box {
            width: 100%; background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(168, 85, 247, 0.3); padding: 18px; border-radius: 20px; font-size: 15px; color: #ffffff; outline: none; margin-bottom: 20px; text-align: left; transition: all 0.3s;
        }

        .input-box:focus { border-color: #a855f7; box-shadow: var(--neon-glow); }
        .input-box::placeholder { color: rgba(255, 255, 255, 0.25); }

        .key-display {
            background-color: rgba(0, 0, 0, 0.3); padding: 16px; border-radius: 20px; font-size: 13px; font-weight: bold; letter-spacing: 0.5px; color: var(--text-purple); margin-bottom: 24px; border: 1px solid rgba(197, 153, 255, 0.15); word-break: break-all; text-align: left;
        }

        .info-row { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
        .info-box { background: var(--box-bg); border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; }

        .aim-control-box {
            background: var(--box-bg); border: 1px solid var(--border-color); border-radius: 24px; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; text-align: left;
        }

        .aim-text-group { display: flex; flex-direction: column; gap: 2px; }
        .aim-status { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.5); }
        .aim-title { font-size: 16px; font-weight: bold; }

        .switch { position: relative; display: inline-block; width: 54px; height: 30px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #000000; transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #a855f7; }
        input:checked + .slider:before { transform: translateX(24px); }

        .server-info-box { background: rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; padding: 18px; text-align: left; margin-bottom: 28px; }
        .server-header { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: rgba(255, 255, 255, 0.4); margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
        .server-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
        .server-label { color: rgba(255, 255, 255, 0.6); }
        .server-value { font-weight: 500; color: #ffffff; }

        .btn-main {
            background: rgba(168, 85, 247, 0.1); color: #ffffff; border: 1px solid #a855f7; width: 100%; padding: 18px; border-radius: 20px; font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; margin-bottom: 20px; box-shadow: inset 0 0 10px rgba(168, 85, 247, 0.2); transition: all 0.2s ease;
        }
        .btn-main:active { transform: scale(0.98); box-shadow: var(--neon-glow); }

        .sub-buttons-group { display: flex; gap: 12px; margin-bottom: 24px; }
        .btn-sub { 
            flex: 1; 
            background: rgba(255, 255, 255, 0.03); 
            color: #ffffff; 
            border: 1px solid var(--border-color); 
            padding: 14px; 
            border-radius: 18px; 
            font-size: 13px; 
            font-weight: 600; 
            text-decoration: none; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 6px; 
            transition: background 0.2s; 
        }
        .btn-sub:active { background: rgba(255, 255, 255, 0.1); }
        
        .footer-credit { font-size: 12px; color: rgba(255, 255, 255, 0.3); display: flex; justify-content: center; align-items: center; gap: 4px; }
    </style>
</head>
<body>

    <div class="panel-container">
        <!-- ĐẦU TRANG THƯƠNG HIỆU GAME -->
        <div class="brand-header">
            <div class="brand-title">
                <h1>FREE FIRE MAX</h1>
                <p>BY MINH QUÂN IOS</p>
            </div>
            <div class="status-badge">
                <div class="status-online">ONLINE</div>
                <div class="status-details">PING <span id="pingVal">24</span>ms USERS <span id="userVal">4312</span></div>
            </div>
        </div>

        <!-- ================= MÀN HÌNH 1: NHẬP LICENSE KEY ================= -->
        <div id="loginScreen">
            <div class="license-header">🔑 LICENSE KEY</div>
            <input type="text" class="input-box" id="licenseInput" placeholder="Nhập mã bản quyền...">
            
            <!-- Nút kích hoạt gọi hàm validateKey() -->
            <button class="btn-main" onclick="validateKey()">KÍCH HOẠT KEY →</button>
            
            <div class="sub-buttons-group">
                <a href="https://link-lay-key-cua-ban.com" target="_blank" class="btn-sub">🔓 GET KEY</a>
                <a href="https://link-tai-cert-cua-ban.com" target="_blank" class="btn-sub">🛡️ CERT</a>
            </div>
        </div>

        <!-- ================= MÀN HÌNH 2: BẢNG PANEL ĐIỀU KHIỂN ================= -->
        <div id="panelScreen" style="display: none;">
            <div class="key-display" id="activatedKeyTitle">ID: LOADING...</div>
            
            <div class="info-row">
                <div class="info-box" id="userIp">14.162.37.119</div>
                <div class="info-box" id="keyTimer" style="color: #ff5555;">⏳ 05:00:00</div>
            </div>
            
            <div class="aim-control-box">
                <div class="aim-text-group">
                    <span class="aim-status">CAN THIỆP GAME ACTIVE</span>
                    <span class="aim-title">Aim drag 7.0 (Auto Lock)</span>
                </div>
                <label class="switch">
                    <input type="checkbox" id="aimToggle" checked onchange="updateAimStatus()">
                    <span class="slider"></span>
                </label>
            </div>
            
            <div class="server-info-box">
                <div class="server-header">📡 SERVER INFO (BYPASS CONFIG)</div>
                <div class="server-row">
                    <span class="server-label">Host:</span>
                    <span class="server-value" id="customHost">apex.MINHQUANIOS.store</span>
                </div>
            </div>
        </div>
        
        <div class="footer-credit">⚡ Phát triển bởi Minh Quân iOS</div>
    </div>

    <!-- ================= JAVASCRIPT XỬ LÝ ĐĂNG NHẬP KEY ================= -->
    <script>
        // Danh sách các Key hợp lệ bạn có thể tự thêm hoặc sửa ở đây
        // Ví dụ: "VIP-VINE-123" là key vĩnh viễn, "FREE-5H" là key 5 tiếng
        const validKeys = ["VIP-VINE-123", "FREE-5H", "MINHQUANIOS2026"];

        function validateKey() {
            const inputVal = document.getElementById('licenseInput').value.trim();

            if (inputVal === "") {
                alert("Vui lòng nhập mã bản quyền!");
                return;
            }

            // Kiểm tra xem key nhập vào có nằm trong danh sách hợp lệ không
            if (validKeys.includes(inputVal)) {
                // Ẩn màn hình nhập key, hiện màn hình panel
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('panelScreen').style.display = 'block';
                
                // Hiển thị tên key đã kích hoạt lên panel
                document.getElementById('activatedKeyTitle').innerText = "KEY ĐÃ KÍCH HOẠT: " + inputVal;
                
                if(inputVal === "VIP-VINE-123") {
                    document.getElementById('keyTimer').innerText = "⏳ VĨNH VIỄN";
                    document.getElementById('keyTimer').style.color = "#00ffcc";
                } else {
                    document.getElementById('keyTimer').innerText = "⏳ 05:00:00";
                    document.getElementById('keyTimer').style.color = "#ff5555";
                }
            } else {
                alert("Mã bản quyền không chính xác hoặc đã hết hạn!");
            }
        }

        function updateAimStatus() {
            const isChecked = document.getElementById('aimToggle').checked;
            console.log("Aim status: " + isChecked);
        }
    </script>
</body>
</html>
